      ],
      의미: "지표가 어긋나 신뢰를 잃는 일의 대부분은 모델이 틀려서가 아니라 같은 숫자가 여러 출처에서 나오기 때문입니다. 단일 원천을 만들고 나머지를 파생으로 두는 구조는 데이터 마트 설계의 기본 원칙과 같고, 그 필요를 실무에서 직접 겪고 스스로 해결했습니다.",
      한계: "스프레드시트 참조 기반이라 데이터가 늘면 성능·권한 관리에 한계가 있습니다. 동일 설계를 DB와 SQL 뷰로 구현하는 것이 다음 학습 목표입니다.",
    },
  ],
};

<style>
  :root{
    --navy:#1F3864; --teal:#1F6F6B; --red:#C0392B;
    --ink:#1a1a1a; --body:#3a3f46; --muted:#7a828c;
    --bg:#ffffff; --panel:#F5F7FA; --panel2:#F1F7F6; --line:#e3e7ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#9CC0F5; --teal:#6FCFC7; --red:#FF8B7A;
      --ink:#ececee; --body:#c3c8d0; --muted:#8f98a4;
      --bg:#14161a; --panel:#1c2026; --panel2:#182220; --line:#2b3138;
    }
  }
  :root[data-theme="dark"]{
      --navy:#9CC0F5; --teal:#6FCFC7; --red:#FF8B7A;
      --ink:#ececee; --body:#c3c8d0; --muted:#8f98a4;
      --bg:#14161a; --panel:#1c2026; --panel2:#182220; --line:#2b3138;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--body);
    font-family:"Noto Sans KR","맑은 고딕","Malgun Gothic",system-ui,sans-serif;
    font-weight:400;line-height:1.72;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 96px}

  /* HERO */
  .hero{padding:72px 0 44px;border-bottom:3px solid var(--navy)}
  .hero .role{font-size:13px;letter-spacing:.14em;color:var(--teal);font-weight:700;margin-bottom:14px}
  .hero h1{margin:0 0 6px;font-size:clamp(34px,6vw,52px);font-weight:900;color:var(--navy);letter-spacing:-.02em;line-height:1.15}
  .hero .en{font-size:15px;color:var(--muted);font-weight:400;margin-left:10px;letter-spacing:.04em}
  .hero .tag{margin:26px 0 20px;font-size:clamp(17px,2.6vw,22px);font-weight:700;color:var(--ink);line-height:1.5}
  .hero p{margin:0 0 4px;font-size:15px}
  .contact{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
  .contact b{color:var(--body);font-weight:500}
  .certs{margin-top:14px;font-size:13px;color:var(--muted)}

  /* SECTION */
  section{margin-top:64px}
  h2{margin:0 0 6px;font-size:26px;font-weight:900;color:var(--navy);letter-spacing:-.01em}
  .sub{margin:0 0 26px;font-size:14px;color:var(--muted)}
  h2+.sub{margin-top:-2px}

  /* TIMELINE */
  .tl{border-left:2px solid var(--line);padding-left:22px;margin-left:4px}
  .tl-item{position:relative;padding-bottom:26px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-28px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--teal)}
  .tl-item .p{font-size:13px;color:var(--muted);margin-bottom:2px}
  .tl-item .o{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:3px}
  .tl-item .d{font-size:14px}

  /* SKILL TABLE */
  .sk{width:100%;border-collapse:collapse;font-size:14px}
  .sk th{text-align:left;padding:11px 12px;background:var(--panel);color:var(--navy);font-size:13px;font-weight:700;border-bottom:1px solid var(--line)}
  .sk td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  .sk td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
  .sk td:nth-child(2){color:var(--teal);font-weight:700;white-space:nowrap;letter-spacing:.06em}
  .sk td.chk{color:var(--red)}
  .sk td:last-child{color:var(--body)}

  /* WAY CARDS */
  .ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .way{background:var(--panel2);border-left:3px solid var(--teal);padding:18px 20px;border-radius:0 6px 6px 0}
  .way b{display:block;color:var(--teal);font-size:15px;margin-bottom:6px}
  .way span{font-size:14px;line-height:1.6}

  /* PROJECT CARD */
  .pj{border:1px solid var(--line);border-radius:10px;margin-bottom:26px;overflow:hidden;background:var(--bg)}
  .pj-head{padding:26px 28px 22px;border-bottom:1px solid var(--line)}
  .pj-no{font-size:13px;font-weight:900;color:var(--teal);letter-spacing:.1em;margin-bottom:8px}
  .pj-head h3{margin:0 0 5px;font-size:22px;font-weight:800;color:var(--navy);line-height:1.3}
  .pj-head .psub{font-size:15px;color:var(--body);margin-bottom:10px}
  .pj-head .pmeta{font-size:13px;color:var(--muted)}
  .tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
  .tags span{font-size:12px;color:var(--teal);border:1px solid var(--teal);border-radius:100px;padding:3px 11px;opacity:.9}
  .mets{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
  .met{background:var(--panel);padding:18px 14px;text-align:center}
  .met b{display:block;font-size:19px;font-weight:800;color:var(--navy);margin-bottom:3px}
  .met.chk b{color:var(--red)}
  .met span{font-size:12px;color:var(--muted)}
  .pj-body{padding:28px}
  .blk{margin-bottom:26px}
  .blk:last-child{margin-bottom:0}
  .blk>h4{margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line);
    font-size:15px;font-weight:800;color:var(--teal)}
  .blk>h4 em{font-style:normal;color:var(--navy);margin-right:9px;font-weight:900}
  .blk p{margin:0 0 7px;font-size:14.5px}
  ul{margin:0;padding-left:19px}
  li{margin-bottom:6px;font-size:14px}
  li::marker{color:var(--teal)}
  .step{margin-bottom:15px}
  .step b{display:block;font-size:14px;color:var(--ink);margin-bottom:6px}
  .impact{background:var(--panel2);border-left:3px solid var(--teal);padding:18px 22px;border-radius:0 6px 6px 0;margin-top:22px}
  .impact b{color:var(--teal);font-size:14px;display:block;margin-bottom:5px}
  .impact span{font-size:14px;line-height:1.7}
  .limit{margin-top:14px;font-size:13px;color:var(--muted)}
  .limit b{color:var(--body);font-weight:600}
  .chk-note{color:var(--red);font-weight:600}

  footer{margin-top:76px;padding-top:28px;border-top:3px solid var(--navy);font-size:14px;color:var(--muted)}
  footer b{display:block;font-size:20px;color:var(--navy);font-weight:800;margin-bottom:8px}
  .note{margin-top:20px;font-size:13px;color:var(--red)}

  @media (max-width:640px){
    .hero{padding:48px 0 32px}
    .mets{grid-template-columns:1fr}
    .pj-head,.pj-body{padding:20px}
    section{margin-top:48px}
  }
  @media print{
    body{background:#fff}
    .pj{break-inside:avoid;page-break-inside:avoid}
  }
</style>

<div class="wrap" id="app"></div>

<script>
const E=(s)=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const MARK=(s)=>E(s).replace(/\[확인필요[^\]]*\]/g,m=>`<span class="chk-note">${m}</span>`);
const LI=(a)=>`<ul>${a.map(x=>`<li>${MARK(x)}</li>`).join("")}</ul>`;

const D=DATA;
document.title = D.이름 + " 포트폴리오";

let h = `
<div class="hero">
  <div class="role">${E(D.직무).toUpperCase()} &nbsp;PORTFOLIO</div>
  <h1>${E(D.이름)}<span class="en">${E(D.영문이름)}</span></h1>
  <div class="tag">${E(D.한줄소개)}</div>
  ${D.소개글.map(x=>`<p>${E(x)}</p>`).join("")}
  <div class="contact"><span><b>${E(D.연락처)}</b></span><span><b>${E(D.이메일)}</b></span></div>
  <div class="certs">${D.자격증.map(E).join(" &nbsp;·&nbsp; ")}</div>
</div>

<section>
  <h2>경력</h2>
  <div class="tl">${D.경력.map(c=>`
    <div class="tl-item"><div class="p">${E(c.기간)}</div><div class="o">${E(c.소속)}</div><div class="d">${E(c.요약)}</div></div>`).join("")}
  </div>
</section>

<section>
  <h2>학력 · 교육</h2>
  <div class="tl">${D.학력.map(c=>`
    <div class="tl-item"><div class="p">${E(c.기간)}</div><div class="o">${E(c.학교)}</div><div class="d">${E(c.내용)}</div></div>`).join("")}
  </div>
</section>

<section>
  <h2>스킬</h2>
  <p class="sub">모델링 경험보다 문제 정의와 검증 설계에 강점이 있습니다. 별점은 실무에서 실제로 산출물을 만들어 본 빈도 기준입니다.</p>
  <table class="sk"><thead><tr><th>도구 · 역량</th><th>수준</th><th>활용 내용</th></tr></thead><tbody>
    ${D.스킬.map(s=>`<tr><td>${E(s.이름)}</td><td class="${s.수준.includes("확인")?"chk":""}">${E(s.수준)}</td><td>${MARK(s.설명)}</td></tr>`).join("")}
  </tbody></table>
</section>

<section>
  <h2>일하는 방식</h2>
  <div class="ways">${D.일하는방식.map(w=>`
    <div class="way"><b>${E(w.제목)}</b><span>${E(w.설명)}</span></div>`).join("")}
  </div>
</section>

<section>
  <h2>프로젝트</h2>
  <p class="sub">데이터 분석 성격이 강한 순서로 배치했습니다. 각 프로젝트는 문제 정의 → 접근 방법 → 실행 → 결과 순으로 기술했습니다.</p>
  ${D.프로젝트.map(p=>`
  <article class="pj">
    <div class="pj-head">
      <div class="pj-no">PROJECT ${E(p.번호)}</div>
      <h3>${E(p.제목)}</h3>
      <div class="psub">${E(p.부제)}</div>
      <div class="pmeta">${E(p.소속기간)}</div>
      <div class="tags">${p.태그.map(t=>`<span>${E(t)}</span>`).join("")}</div>
    </div>
    <div class="mets">${p.지표.map(m=>`
      <div class="met ${m.값.includes("확인")?"chk":""}"><b>${E(m.값)}</b><span>${E(m.설명)}</span></div>`).join("")}
    </div>
    <div class="pj-body">
      <div class="blk"><h4><em>P</em>문제 정의</h4>${p.문제정의.map(x=>`<p>${MARK(x)}</p>`).join("")}</div>
      <div class="blk"><h4><em>A</em>접근 방법과 선택 기준</h4>${LI(p.대안검토)}</div>
      <div class="blk"><h4><em>A</em>실행</h4>
        ${p.실행.map(s=>`<div class="step"><b>${E(s.소제목)}</b>${LI(s.내용)}</div>`).join("")}
      </div>
      <div class="blk"><h4><em>R</em>결과</h4>${LI(p.결과)}</div>
      <div class="impact"><b>분석가로서의 의미</b><span>${E(p.의미)}</span></div>
      ${p.한계?`<div class="limit"><b>한계 및 다음 단계</b> ${MARK(p.한계)}</div>`:""}
    </div>
  </article>`).join("")}
</section>

<footer>
  <b>${E(D.한줄소개)}</b>
  ${E(D.이름)} &nbsp;·&nbsp; ${E(D.연락처)} &nbsp;·&nbsp; ${E(D.이메일)}
  <div class="note">※ 붉게 표시된 [확인필요] 항목은 원자료를 확인해 채워 넣은 뒤 표시를 지우세요.</div>
</footer>`;
document.getElementById("app").innerHTML = h;
</script>
